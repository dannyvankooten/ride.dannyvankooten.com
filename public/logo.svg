<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">

  <!-- Background -->
  <rect width="140" height="140" fill="#ffffff"/>

  <!-- Wheel: outer tire -->
  <circle cx="70" cy="70" r="54" fill="none" stroke="#0D1B4B" stroke-width="9"/>

  <!-- Wheel: 6 spokes -->
  <line x1="70"    y1="16"  x2="70"    y2="62"  stroke="#0D1B4B" stroke-width="3"/>
  <line x1="116.8" y1="43"  x2="76.9"  y2="66"  stroke="#0D1B4B" stroke-width="3"/>
  <line x1="116.8" y1="97"  x2="76.9"  y2="74"  stroke="#0D1B4B" stroke-width="3"/>
  <line x1="70"    y1="124" x2="70"    y2="78"  stroke="#0D1B4B" stroke-width="3"/>
  <line x1="23.2"  y1="97"  x2="63.1"  y2="74"  stroke="#0D1B4B" stroke-width="3"/>
  <line x1="23.2"  y1="43"  x2="63.1"  y2="66"  stroke="#0D1B4B" stroke-width="3"/>

  <!-- Wheel: hub -->
